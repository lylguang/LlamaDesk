<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>动态表情包</title>
<!--
  小应用：动态表情包（一张照片 → 一整套能用的表情 → 循环动图）。

  两条链路，一条比一条远：
    A. 静态：一张照片（或一段角色描述）→ N 张统一画风的表情（默认 16 张）。
    B. 动态：某一张静态表情 → 2 个动作关键帧 → 合成 GIF，走 `omni.gif.make`。
       合成在宿主里做（页面里没有编码器），页面只负责排帧序与选速度。

  **模型在页面里自己选**（`omni.image.models` 发来目录）：云端 → 厂商 + 模型，
  本地 → 引擎 + 模型。选中的值随每次生成请求发回去，由宿主按目录再校验一遍；
  页面不改写用户在生图页保存的配置。云端支持参考图（照片 → 同一套表情），
  本地引擎只能文生图 —— 于是页面走的提示词也不一样：
    · 参考图模式：以照片为参考，"把这个人的表情改成 X"；
    · 文字模式：没有照片可参考，改为"按这段角色描述画一个角色"，靠同一段描述
      维持一整套/一整套动作帧的一致性。
  这个差别由目录里的 `supportsReference` 决定（宿主说了算，页面不按后端名去猜）。

  几处刻意的取舍：
    - **照片只上传一次**：一键 16 张都改同一张照片，宿主按 (应用, 路径) 缓存暂存结果，
      所以每张只是一次改图调用，不会在数据目录里留下 16 份同样的源图副本。
    - **键帧只生成 2 张**：循环里的第一帧直接用源表情本身（不花调用），另两张是
      "动作中段 / 动作顶点"，播放顺序排成 A-B-C-B —— 首尾同源，循环点看不出跳变，
      而且人物永远是同一个（每张都以源图为参考，不做链式改图，避免越改越不像）。
    - **改速度 / 尺寸要重新合成，但不必重新生成**：帧的 ref 还在，`omni.gif.make`
      再来一次即可 —— 页面上明确写出这一点，否则用户会以为要重跑一遍生成。
    - 页签切换不销毁结果：一套 16 张要跑好几分钟，切走再切回来不该清空。

  宿主注入：基础样式、window.omni 运行时、window.__OMNI_BOOT__。
-->
<style>
  /* 模型选择行：分段控件（云端 / 本地）+ 厂商 / 引擎 + 模型 */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font: inherit; font-size: 12px; padding: 5px 12px;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .pick { max-width: 190px; }
  .pick.grow { max-width: none; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .tabs button {
    appearance: none; border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font: inherit; font-weight: 500; padding: 9px 12px; border-bottom: 2px solid transparent;
  }
  .tabs button:hover { color: var(--fg); }
  .tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

  .two { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .two > .left { flex: 1 1 240px; min-width: 220px; max-width: 340px; }
  .two > .right { flex: 2 1 380px; min-width: 260px; }

  /* 上传区：点一下就是选文件，选完直接变成缩略图（重选是同一个入口） */
  .drop {
    width: 100%; min-height: 220px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 6px; font: inherit; color: inherit; background: transparent;
  }
  .drop .big { font-size: 22px; }

  /* 十六格的表情格子在窄窗口下两列就够，别再挤成一条线 */
  @media (max-width: 640px) { .two > .left { max-width: none; } }
  .drop .big { font-size: 22px; line-height: 1; }
  .drop .t { font-size: 13px; font-weight: 500; color: var(--fg); }
  .drop img { max-width: 100%; max-height: 300px; border-radius: 12px; display: block; }
  .drop.filled { padding: 10px; }

  /* 画风卡：一张图不用配（预览图是小应用自己画不出来的），用色块 + 名字，
     与"表情包到底长什么样"的关系靠名字与下面那句说明交代 */
  .styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .style {
    appearance: none; cursor: pointer; font: inherit; text-align: left;
    border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .style:hover { border-color: var(--accent); }
  .style[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .style .sw { height: 42px; border-radius: 8px; }
  .style .nm { font-size: 12px; font-weight: 600; }
  .style .dt { font-size: 10.5px; line-height: 1.4; color: var(--muted); }
  .sw.pixel { background: linear-gradient(135deg, #f59e0b 0 25%, #10b981 25% 50%, #3b82f6 50% 75%, #ef4444 75% 100%); image-rendering: pixelated; }
  .sw.doodle { background: repeating-linear-gradient(45deg, #fff 0 6px, #d4d4d8 6px 7px); }
  .sw.chibi { background: radial-gradient(circle at 35% 30%, #fecdd3, #f472b6 60%, #be185d); }
  .sw.badge { background: linear-gradient(140deg, #fff, #fde68a 55%, #fbbf24); }
  .sw.custom { background: linear-gradient(140deg, var(--soft), var(--line)); }

  /* 开关：宿主基础样式里只有 checkbox 的 accent-color，这里要一个真正的拨动开关 */
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch .track {
    width: 38px; height: 22px; border-radius: 999px; background: var(--line);
    position: relative; transition: background .15s;
  }
  .switch .track::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(16px); }
  .switch .txt { font-size: 12px; }

  .progress { height: 4px; border-radius: 999px; background: var(--soft); overflow: hidden; }
  .progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
  .slot {
    position: relative; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    background: var(--soft); aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
  }
  .slot img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; cursor: zoom-in; }
  .slot .cap {
    position: absolute; left: 4px; bottom: 4px; right: 4px; font-size: 10px; line-height: 1.2;
    text-align: center; color: #fff; background: rgba(0,0,0,.45); border-radius: 6px; padding: 2px 4px;
    pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .slot .ph { font-size: 11px; color: var(--muted); text-align: center; padding: 8px; }
  .slot .acts {
    position: absolute; inset: auto 0 0 0; display: flex; gap: 4px; justify-content: center;
    padding: 24px 4px 4px; opacity: 0; transition: opacity .15s;
    background: linear-gradient(to top, rgba(0,0,0,.55), transparent);
  }
  .slot:hover .acts, .slot:focus-within .acts { opacity: 1; }
  .slot .acts button {
    appearance: none; border: 0; border-radius: 7px; cursor: pointer; font: inherit; font-size: 10.5px;
    padding: 3px 7px; background: rgba(255,255,255,.92); color: #18181b;
  }
  .slot .acts button:hover { background: #fff; }
  .slot .cap.hide { display: none; }
  .slot.failed { border-color: var(--warn); }
  .slot.failed .ph { color: var(--warn); }

  /* GIF 结果区 */
  .gifbox { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .gifbox .stage {
    border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--soft);
    display: flex; align-items: center; justify-content: center; min-width: 180px;
  }
  .gifbox .stage img { display: block; max-width: 320px; max-height: 320px; border-radius: 8px; background: #fff; }
  .frames { display: flex; gap: 6px; flex-wrap: wrap; }
  .frames figure { margin: 0; text-align: center; }
  .frames img { width: 52px; height: 52px; object-fit: contain; border: 1px solid var(--line); border-radius: 8px; background: #fff; display: block; }
  .frames figcaption { font-size: 10px; color: var(--muted); }

  /* 大图预览（点缩略图打开） */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.72); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 24px; z-index: 50;
  }
  .lightbox img { max-width: min(78vw, 560px); max-height: 68vh; border-radius: 14px; background: #fff; }
  .lightbox .bar2 { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .lightbox .cap { color: #fff; font-size: 12px; opacity: .9; }
</style>
</head>
<body>
<div class="shell">
  <div class="hd">
    <h1 data-i18n="title"></h1>
    <span class="sub" data-i18n="sub"></span>
    <span class="sub grow" id="model" style="text-align:right"></span>
  </div>

  <div id="gate" class="card hidden">
    <div class="row">
      <span class="grow err" id="gate-text"></span>
      <button class="btn sm" id="gate-btn" data-i18n="toSettings"></button>
    </div>
  </div>

  <div class="card col" id="model-card">
    <div class="row">
      <span class="lb grow" data-i18n="modelLabel"></span>
      <div class="seg" id="model-kind">
        <button type="button" data-kind="cloud" data-i18n="modelCloud"></button>
        <button type="button" data-kind="local" data-i18n="modelLocal"></button>
      </div>
    </div>
    <div class="row hidden" id="pick-cloud">
      <span class="lb" data-i18n="vendorLabel"></span>
      <select class="field pick" id="pick-provider"></select>
      <span class="lb" data-i18n="modelNameLabel"></span>
      <input class="field pick grow" id="pick-cloud-model" list="cloud-model-options" spellcheck="false" />
      <datalist id="cloud-model-options"></datalist>
    </div>
    <div class="row hidden" id="pick-local">
      <span class="lb" data-i18n="engineLabel"></span>
      <select class="field pick" id="pick-engine"></select>
      <span class="lb" data-i18n="modelNameLabel"></span>
      <input class="field pick grow" id="pick-local-model" list="local-model-options" spellcheck="false" />
      <datalist id="local-model-options"></datalist>
    </div>
    <span class="hint" id="model-note"></span>
  </div>

  <div class="tabs" role="tablist">
    <button id="tabbtn-pack" role="tab" aria-selected="true" data-i18n="tabPack"></button>
    <button id="tabbtn-motion" role="tab" aria-selected="false" data-i18n="tabMotion"></button>
  </div>

  <!-- ── 页签 A：照片 → 一套静态表情 ─────────────────────────────────── -->
  <section id="pane-pack" class="col" role="tabpanel">
    <div class="two">
      <div class="left">
        <button class="drop" id="photo-drop" type="button">
          <span class="big">↑</span>
          <span class="t" data-i18n="photoDrop"></span>
          <span class="hint" data-i18n="photoHint"></span>
        </button>
        <div class="card hidden" id="text-mode-note">
          <div class="col">
            <span class="t" style="font-weight:600" data-i18n="textModeTitle"></span>
            <span class="hint" data-i18n="textModeDesc"></span>
            <button class="btn sm" id="to-cloud" type="button" data-i18n="textModeSwitch"></button>
          </div>
        </div>
      </div>
      <div class="right col">
        <span class="lb" data-i18n="styleLabel"></span>
        <div class="styles" id="styles"></div>
        <input class="field hidden" id="custom-style" data-i18n-ph="customPh" />

        <div class="row" style="justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:9px 12px">
          <span class="grow" style="font-size:12px" data-i18n="withText"></span>
          <label class="switch">
            <input type="checkbox" id="with-text" checked />
            <span class="track"></span>
          </label>
        </div>

        <div class="row">
          <span class="lb" data-i18n="countLabel"></span>
          <span class="grow"></span>
          <div class="row" id="counts"></div>
        </div>

        <span class="hint" data-i18n="countHint"></span>

        <span class="lb" id="extra-label" data-i18n="extraLabel"></span>
        <textarea class="field" id="extra" data-i18n-ph="extraPh" style="min-height:56px"></textarea>

        <div class="row">
          <button class="btn primary" id="run-pack" disabled data-i18n="runPack"></button>
          <button class="btn hidden" id="stop-pack" data-i18n="stop"></button>
          <span class="busy hidden" id="pack-busy"><span class="spin"></span><span id="pack-busy-text"></span></span>
        </div>
        <div class="progress hidden" id="pack-progress"><i></i></div>
        <span class="err" id="pack-err"></span>
      </div>
    </div>

    <div class="col hidden" id="pack-result">
      <div class="row">
        <span class="lb grow" id="pack-summary"></span>
        <button class="btn sm" id="save-all" data-i18n="saveAll"></button>
      </div>
      <div class="grid" id="pack-grid"></div>
    </div>
  </section>

  <!-- ── 页签 B：一张静态表情 → 循环 GIF ─────────────────────────────── -->
  <section id="pane-motion" class="col hidden" role="tabpanel">
    <div class="two">
      <div class="left col">
        <button class="drop" id="motion-drop" type="button">
          <span class="big">↑</span>
          <span class="t" data-i18n="motionDrop"></span>
          <span class="hint" data-i18n="motionHint"></span>
        </button>
        <div class="card col hidden" id="motion-text-src">
          <span class="lb" data-i18n="characterLabel"></span>
          <textarea class="field" id="motion-character" data-i18n-ph="characterPh" style="min-height:64px"></textarea>
          <span class="hint" data-i18n="motionTextNote"></span>
        </div>
      </div>
      <div class="right col">
        <span class="lb" data-i18n="motionLabel"></span>
        <div class="row" id="motions"></div>

        <div class="row">
          <span class="lb" data-i18n="sizeLabel"></span>
          <span class="grow"></span>
          <div class="row" id="gif-sizes"></div>
        </div>
        <div class="row">
          <span class="lb" data-i18n="speedLabel"></span>
          <span class="grow"></span>
          <div class="row" id="gif-speeds"></div>
        </div>

        <div class="row">
          <button class="btn primary" id="run-gif" disabled data-i18n="makeGif"></button>
          <button class="btn hidden" id="re-gif" data-i18n="reMake"></button>
          <span class="busy hidden" id="gif-busy"><span class="spin"></span><span id="gif-busy-text"></span></span>
        </div>
        <span class="hint" id="motion-mode-note" data-i18n="reMakeHint"></span>
        <span class="hint" data-i18n="reMakeHint"></span>
        <span class="err" id="gif-err"></span>
      </div>
    </div>

    <div class="card hidden" id="gif-result">
      <div class="gifbox">
        <div class="stage"><img id="gif-img" alt="gif" /></div>
        <div class="col grow">
          <span class="lb" data-i18n="framesLabel"></span>
          <div class="frames" id="gif-frames"></div>
          <div class="row">
            <button class="btn primary" id="save-gif" data-i18n="saveGif"></button>
            <span class="ok" id="gif-ok"></span>
          </div>
          <span class="hint" id="gif-meta"></span>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="lightbox hidden" id="lightbox">
  <img id="lightbox-img" alt="sticker" />
  <div class="cap" id="lightbox-cap"></div>
  <div class="bar2">
    <button class="btn sm" id="lb-save" data-i18n="saveOne"></button>
    <button class="btn sm" id="lb-again" data-i18n="retry"></button>
    <button class="btn sm" id="lb-motion" data-i18n="animate"></button>
    <button class="btn sm" id="lb-close" data-i18n="close"></button>
  </div>
</div>

        // 有 Key 就当可用，具体能不能跑由上游回答。
        ready: known ? known.ready : provider.models.length > 0,
        label: provider.name + (model ? ' · ' + model : ''),
        why: known && !known.ready ? (known.note || '') : '',
      };
      return;
    }
    var group = localGroup();
    if (!group) { state.choice = null; return; }
    state.localBackend = group.backend;
    var firstLocal = firstOf(group.models);
    var localModel = state.localModel.trim() || (firstLocal ? firstLocal.id : '');
    var picked = null;
    for (var j = 0; j < group.models.length; j++) {
      if (group.models[j].id === localModel) picked = group.models[j];
    }
    state.choice = {
      backend: group.backend,
      providerId: '',
      model: localModel,
      supportsReference: Boolean(state.catalog.supportsReference[group.backend]),
      ready: Boolean(picked && picked.ready),
      label: group.label + (localModel ? ' · ' + localModel : ''),
      why: (picked && !picked.ready ? picked.note : '') || group.note || '',
    };
  }

  function paintPicker() {
    if (!state.catalog) return;
    var cloud = state.kind === 'cloud';
    $('#pick-cloud').classList.toggle('hidden', !cloud);
    $('#pick-local').classList.toggle('hidden', cloud);
    document.querySelectorAll('#model-kind button').forEach(function (btn) {
      btn.setAttribute('aria-pressed', btn.dataset.kind === state.kind ? 'true' : 'false');
    });

    var providerSel = $('#pick-provider');
    providerSel.innerHTML = '';
    cloudProviders().forEach(function (provider) {
      var opt = document.createElement('option');
      opt.value = provider.providerId;
      opt.textContent = provider.name;
      providerSel.appendChild(opt);
    });
    var provider = cloudProvider();
    if (provider) providerSel.value = provider.providerId;

    var cloudList = $('#cloud-model-options');
    cloudList.innerHTML = '';
    (provider ? provider.models : []).forEach(function (model) {
      var opt = document.createElement('option');
      opt.value = model.id;
      opt.label = model.ready ? model.label : model.label + ' · ' + (model.note || '');
      cloudList.appendChild(opt);
    });
    $('#pick-cloud-model').value = state.cloudModel;

    var engineSel = $('#pick-engine');
    engineSel.innerHTML = '';
    localGroups().forEach(function (group) {
      var opt = document.createElement('option');
      opt.value = group.backend;
      opt.textContent = group.label;
      engineSel.appendChild(opt);
    });
    var group = localGroup();
    if (group) engineSel.value = group.backend;

    var localList = $('#local-model-options');
    localList.innerHTML = '';
    (group ? group.models : []).forEach(function (model) {
      var opt = document.createElement('option');
      opt.value = model.id;
      opt.label = model.ready ? model.label : model.label + ' · ' + (model.note || '');
      localList.appendChild(opt);
    });
    $('#pick-local-model').value = state.localModel;

    syncChoice();
    var choice = state.choice;
    // 输入框里显示**实际会用的那个**：默认取该厂商/引擎的第一个模型，
    // 空着却已经在用某个模型是最容易让人误判的一处界面。
    if (choice) {
      if (state.kind === 'cloud') {
        $('#pick-cloud-model').value = choice.model;
        state.cloudModel = choice.model;
      } else {
        $('#pick-local-model').value = choice.model;
        state.localModel = choice.model;
      }
    }
    var note = $('#model-note');
    if (!choice) {
      note.className = 'err';
      note.textContent = t('noModels');
    } else if (!choice.ready && choice.why) {
      note.className = 'err';
      note.textContent = t('modelNotReady', { name: choice.label, why: choice.why });
    } else {
      note.className = 'hint';
      note.textContent = choice.supportsReference ? t('modelNoteRef') : t('modelNoteText');
    }
    $('#model').textContent = choice ? t('modelInUse', { label: choice.label }) : '';
    applyMode();
    checkGate();
  }

  /** 参考图模式 / 文字模式在界面上的差别：要不要上传照片、描述字段叫什么。 */
  function applyMode() {
    var reference = supportsReference();
    $('#photo-drop').classList.toggle('hidden', !reference);
    $('#text-mode-note').classList.toggle('hidden', reference);
    $('#extra-label').textContent = t(reference ? 'extraLabel' : 'characterLabel');
    $('#extra').placeholder = t(reference ? 'extraPh' : 'characterPh');
    // 页签 B：参考图模式要一张源表情（改它），文字模式只要一段描述（重画它）
    $('#motion-drop').classList.toggle('hidden', !reference);
    $('#motion-text-src').classList.toggle('hidden', reference);
    $('#motion-mode-note').className = reference ? 'hint hidden' : 'hint';
  }

  /**
   * 目录拉取与初始化。
   *
   * 默认值取用户在生图页保存的那份配置（云端就是那个厂商 + 模型），所以"我平时用
   * gpt-image-2"的人打开这一页，选中的就是 gpt-image-2 —— 不必再选一次。
   */
  function loadModels(resetSelection) {
    return omni.image.models().then(function (catalog) {
      state.catalog = catalog || null;
      var current = (catalog && catalog.current) || {};
      if (!resetSelection) {
        // 能力变化（用户刚在设置里配好厂商又切回来）只刷新目录与就绪状态，
        // 不把他在这一页已经选好的模型顶回保存的那份。
        paintPicker();
        return catalog;
      }
      if (current.backend === 'api') {
        state.kind = 'cloud';
        state.providerId = current.providerId || '';
        state.cloudModel = current.model || '';
      } else if (current.backend === 'mlx' || current.backend === 'comfyui') {
        state.kind = 'local';
        state.localBackend = current.backend;
        state.localModel = current.model || '';
      } else {
        // 生图页没配过：有云端厂商就用云端（效果最好），否则落到本地第一组
        state.kind = cloudProviders().length > 0 ? 'cloud' : 'local';
      }
      paintPicker();
      return catalog;
    }).catch(function (e) {
      omni.log('models.failed', e.message || String(e), {});
      state.catalog = null;
      checkGate();
    });
  }

  // ---------------------------------------------------------------------------
  // 能力门槛
  // ---------------------------------------------------------------------------
  function checkGate() {
    var choice = state.choice;
    var usable = Boolean(choice && choice.ready);
    $('#gate').classList.toggle('hidden', usable);
    if (!usable) {
      $('#gate-text').textContent = choice
        ? t('modelNotReady', { name: choice.label, why: choice.why || '' })
        : t('noModels');
    }
    syncButtons();
  }

  function syncButtons() {
    // 两种模式各有一个"必要输入"：云端要照片，本地要一段角色描述。
    $('#run-pack').disabled = state.busy || !state.choice || !state.choice.ready ||
      (supportsReference() ? !state.photo : !state.extra.trim());
    $('#run-gif').disabled = state.gifBusy || !state.choice || !state.choice.ready || !motionReady();
    $('#re-gif').classList.toggle('hidden', !state.frames || state.gifBusy);
    $('#stop-pack').classList.toggle('hidden', !state.busy);
  }

  /** 动图能不能开跑：参考图模式要一张源图，文字模式要一段描述（或刚做过的一整套）。 */
  function motionReady() {
    if (supportsReference()) return Boolean(state.source);
    return Boolean((state.packContext && state.packContext.character) || state.extra.trim().length > 0);
  }

  // ---------------------------------------------------------------------------
  // 上传
  // ---------------------------------------------------------------------------
  /**
   * 选一张图并交给宿主暂存。
   *
   * 暂存是为了拿到两样沙箱里拿不到的东西：一个能显示的媒体地址（`file://` 在
   * opaque origin 下打不开），以及宿主签发的 ref —— 后面所有改图都以它为参考，
   * 生成的 GIF 也需要拿它当第一帧。暂存失败（格式不支持等）就当这次选图没发生。
   */
  function pickPhoto(into, kinds) {
    return omni.files.pickAndRead({ types: kinds || 'png,jpg,jpeg,webp,bmp' })
      .then(function (picked) {
        if (!picked || !picked.dataUrl) return null;
        return omni.image.stage({ path: picked.path }).then(function (staged) {
          var src = { path: picked.path, dataUrl: staged.url || picked.dataUrl, ref: staged.ref, name: picked.name };
          into(src);
          return src;
        });
      });
  }

  function paintDrop(node, src, emptyKey, hintKey) {
    node.innerHTML = '';
    node.classList.toggle('filled', Boolean(src));
    if (!src) {
      node.appendChild(el('span', 'big', '↑'));
      node.appendChild(el('span', 't', t(emptyKey)));
      node.appendChild(el('span', 'hint', t(hintKey)));
      return;
    }
    var img = el('img');
    // 两个来源都要认：上传的图有 dataUrl（宿主暂存后也会给媒体地址），
    // 从一套里带过来的只有媒体地址。
    img.src = src.dataUrl || src.url;
    img.alt = src.name || 'source';
    node.appendChild(img);
  }

  $('#photo-drop').addEventListener('click', function () {
    if (state.busy) return;
    pickPhoto(function (src) { state.photo = src; }, 'png,jpg,jpeg,webp,bmp,heic')
      .then(function (picked) {
        if (!picked) return;
        paintDrop($('#photo-drop'), state.photo, 'photoDrop', 'photoHint');
        syncButtons();
      })
      .catch(function (e) { showErr('pack-err', e.message || String(e)); });
  });

  $('#motion-drop').addEventListener('click', function () {
    if (state.gifBusy) return;
    pickPhoto(function (src) { state.source = src; state.frames = null; state.gif = null; })
      .then(function (picked) {
        if (!picked) return;
        paintDrop($('#motion-drop'), state.source, 'motionDrop', 'motionHint');
        renderGif();
        syncButtons();
      })
      .catch(function (e) { showErr('gif-err', e.message || String(e)); });
  });

  // ---------------------------------------------------------------------------
  // 页签 A 的控件
  // ---------------------------------------------------------------------------
  var styleNodes = {};
  PROMPT.styles.forEach(function (style) {
    var btn = el('button', 'style');
    btn.type = 'button';
    btn.setAttribute('aria-pressed', style.id === state.style.id ? 'true' : 'false');
    btn.appendChild(el('span', 'sw ' + style.sw));
    btn.appendChild(el('span', 'nm', L(style)));
    if (style.id !== 'custom') btn.appendChild(el('span', 'dt', L(style, 'Desc')));
    btn.addEventListener('click', function () {
      state.style = style;
      Object.keys(styleNodes).forEach(function (id) {
        styleNodes[id].setAttribute('aria-pressed', id === style.id ? 'true' : 'false');
      });
      $('#custom-style').classList.toggle('hidden', style.id !== 'custom');
    });
    styleNodes[style.id] = btn;
    $('#styles').appendChild(btn);
  });

  $('#custom-style').addEventListener('input', function () { state.customStyle = this.value; });

  $('#with-text').addEventListener('change', function () { state.withText = this.checked; });

  var countNodes = [];
  COUNTS.forEach(function (n) {
    var chip = el('button', 'chip', String(n));
    chip.type = 'button';
    chip.setAttribute('aria-pressed', n === state.count ? 'true' : 'false');
    chip.addEventListener('click', function () {
      state.count = n;
      countNodes.forEach(function (node) { node.setAttribute('aria-pressed', node.textContent === String(n) ? 'true' : 'false'); });
    });
    countNodes.push(chip);
    $('#counts').appendChild(chip);
  });

  /**
   * 描述字段在页签 A、B 各有一个（同名同值）。
   *
   * 文字模式下它就是"角色"本身，两边都得能改：在页签 B 想调一句描述还得切回页签 A
   * 是很别扭的。两处共用一个值，改任意一处另一处立刻跟上。
   */
  function setCharacter(value) {
    state.extra = value;
    if ($('#extra').value !== value) $('#extra').value = value;
    if ($('#motion-character').value !== value) $('#motion-character').value = value;
    // 文字模式下这段描述是必要输入：它一空，生成按钮就该灰掉
    syncButtons();
  }

  $('#extra').addEventListener('input', function () { setCharacter(this.value); });
  $('#motion-character').addEventListener('input', function () { setCharacter(this.value); });

  // ---------------------------------------------------------------------------
  // 页签 A：一套表情
  // ---------------------------------------------------------------------------
  function showErr(id, message) { $('#' + id).textContent = message || ''; }

  function setPackBusy(on, text) {
    state.busy = on;
    $('#pack-busy').classList.toggle('hidden', !on);
    if (text) $('#pack-busy-text').textContent = text;
    $('#run-pack').disabled = on || !state.choice || !state.choice.ready || (supportsReference() && !state.photo);
    $('#stop-pack').classList.toggle('hidden', !on);
  }

  function packDone() { return state.pack.filter(function (item) { return item.status === 'done'; }).length; }

  function updateProgress() {
    var total = state.pack.length || 1;
    var settled = state.pack.filter(function (item) { return item.status === 'done' || item.status === 'failed'; }).length;
    $('#pack-progress').classList.toggle('hidden', !state.busy);
    var bar = $('#pack-progress').querySelector('i');
    if (bar) bar.style.width = Math.round((settled / total) * 100) + '%';
    $('#pack-summary').textContent = t('packSummary', { done: packDone(), total: state.pack.length });
  }

  function renderSlot(slot, index) {
    var node = el('div', 'slot');
    var cap = el('span', 'cap', omni.lang === 'en' ? slot.emotion.en : slot.emotion.zh);
    if (!state.withText) cap.classList.add('hide');

    if (slot.status === 'done') {
      var img = el('img');
      img.src = slot.url;
      img.alt = slot.emotion.id;
      img.title = t('retry');
      img.addEventListener('click', function () { openLightbox(index); });
      node.appendChild(img);
      node.appendChild(cap);
      node.appendChild(slotActions(index));
    } else if (slot.status === 'failed') {
      node.classList.add('failed');
      node.appendChild(el('div', 'ph', (slot.error || t('failed', { n: index + 1 }))));
      var retry = el('button', 'chip', t('retry'));
      retry.type = 'button';
      retry.style.zIndex = '2';
      retry.addEventListener('click', function () { regenOne(index); });
      node.appendChild(retry);
    } else if (slot.status === 'busy') {
      var busy = el('div', 'ph');
      busy.appendChild(el('span', 'spin'));
      node.appendChild(busy);
      node.appendChild(cap);
    } else {
      node.appendChild(el('div', 'ph', omni.lang === 'en' ? slot.emotion.en : slot.emotion.zh));
    }
    return node;
  }

  function slotActions(index) {
    var acts = el('div', 'acts');
    var mk = function (key, fn) {
      var btn = el('button', null, t(key));
      btn.type = 'button';
      // 格子上的按钮在图片上方：别让点击冒泡到图片（那会打开大图预览）
      btn.addEventListener('click', function (event) { event.stopPropagation(); fn(); });
      return btn;
    };
    acts.appendChild(mk('saveOne', function () { saveOne(index); }));
    acts.appendChild(mk('retry', function () { regenOne(index); }));
    acts.appendChild(mk('animate', function () { sendToMotion(index); }));
    return acts;
  }

  function renderPack() {
    var grid = $('#pack-grid');
    grid.innerHTML = '';
    if (state.pack.length === 0) return;
    state.pack.forEach(function (slot, index) { grid.appendChild(renderSlot(slot, index)); });
    updateProgress();
  }

  function regenOne(index) {
    if (!state.choice || !state.choice.ready) return;
    if (supportsReference() && !state.photo) return;
    var slot = state.pack[index];
    if (!slot || slot.status === 'busy') return;
    slot.status = 'busy';
    slot.error = '';
    renderPack();
    var job = drawOnce(state.photo, packPrompt(slot.emotion));
    job.then(function (image) {
      slot.status = 'done';
      slot.url = image.url;
      slot.ref = image.ref;
    }).catch(function (e) {
      slot.status = 'failed';
      slot.error = e.message || String(e);
      omni.log('pack.retry.failed', slot.error, { emotion: slot.emotion.id });
    }).then(function () { renderPack(); });
  }

  /**
   * 跑一整套。
   *
   * 每张出来就上屏（格子先按情绪排好），失败不打断整套 —— 一套要跑几分钟，
   * "等到最后才知道哪张挂了"是最难受的一种失败方式。
   */
  function runPack() {
    if (state.busy || !state.choice || !state.choice.ready) return;
    // 两种模式各要一样东西：云端要照片（参考图），本地要一段角色描述（没有图可参考）。
    if (supportsReference()) {
      if (!state.photo) { showErr('pack-err', t('needPhoto')); return; }
    } else if (!state.extra.trim()) {
      showErr('pack-err', t('characterRequired'));
      return;
    }
    // 重新跑一套会丢掉现有结果，而每一张都是一次真实的生图调用 —— 先问一句，
    // 别让"再点一下"变成一次静默的重复花费（sandbox 里 confirm 是可用的）。
    var existing = packDone();
    if (existing > 0 && !window.confirm(t('confirmAgain', { n: existing }))) return;
    showErr('pack-err', '');

    // 这一套的上下文：画风与角色描述在开跑那一刻定格，之后用户改了界面也不影响
    // 已经生成/还要补做的那几张（"重做"与动图都按这份上下文走）。
    state.packContext = {
      style: state.style,
      customStyle: state.customStyle,
      character: state.extra,
      withText: state.withText,
      emotion: null,
    };
    var list = PROMPT.emotions.slice(0, state.count);
    state.pack = list.map(function (emotion) { return { emotion: emotion, status: 'pending', url: '', ref: '', error: '' }; });
    state.stopped = false;
    $('#pack-result').classList.remove('hidden');
    renderPack();
    setPackBusy(true, t('working', { done: 0, total: list.length }));

    var cursor = 0;
    var running = 0;

    function tick() {
      if (state.stopped) {
        if (running === 0) finish();
        return;
      }
      while (running < CONCURRENCY && cursor < state.pack.length) {
        start(cursor);
        cursor += 1;
      }
      if (cursor >= state.pack.length && running === 0) finish();
    }

    function start(index) {
      var slot = state.pack[index];
      if (!slot) return;
      running += 1;
      slot.status = 'busy';
      renderPack();
      setPackBusy(true, t('working', { done: packDone(), total: state.pack.length }));
      drawOnce(state.photo, packPrompt(slot.emotion))
        .then(function (image) {
          slot.status = 'done';
          slot.url = image.url;
          slot.ref = image.ref;
        })
        .catch(function (e) {
          slot.status = 'failed';
          slot.error = e.message || String(e);
          omni.log('pack.failed', slot.error, { emotion: slot.emotion.id });
        })
        .then(function () {
          running -= 1;
          renderPack();
          setPackBusy(true, t('working', { done: packDone(), total: state.pack.length }));
          tick();
        });
    }

    function finish() {
      setPackBusy(false);
      $('#pack-progress').classList.add('hidden');
      var failed = state.pack.filter(function (item) { return item.status === 'failed'; }).length;
      if (state.stopped) showErr('pack-err', t('stopped'));
      else if (failed > 0) showErr('pack-err', t('failedMany', { n: failed }));
      updateProgress();
      omni.log('pack.done', 'pack finished', { total: state.pack.length, done: packDone(), failed: failed, style: state.style.id });
    }

    tick();
  }

  $('#run-pack').addEventListener('click', runPack);
  $('#stop-pack').addEventListener('click', function () {
    state.stopped = true;
    $('#stop-pack').classList.add('hidden');
  });

  // ---------------------------------------------------------------------------
  // 存图（大图 / 单张 / 全部）
  // ---------------------------------------------------------------------------
  function toDataUrl(url) {
    return fetch(url, { mode: 'cors' })
      .then(function (res) { return res.blob(); })
      .then(function (blob) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onload = function () { resolve(String(reader.result)); };
          reader.onerror = function () { reject(new Error('读取失败')); };
          reader.readAsDataURL(blob);
        });
      });
  }

  function saveUrl(url, name) {
    return toDataUrl(url).then(function (dataUrl) {
      return omni.files.save({ name: name, dataUrl: dataUrl });
    });
  }

  function saveOne(index) {
    var slot = state.pack[index];
    if (!slot || slot.status !== 'done') return;
    saveUrl(slot.url, 'sticker-' + slot.emotion.id + '-' + Date.now().toString().slice(-5) + '.png')
      .then(function (res) {
        showErr('pack-err', '');
        $('#pack-summary').textContent = t('saved', { name: (res.path || '').split('/').pop() || '' });
      })
      .catch(function (e) { showErr('pack-err', e.message || String(e)); });
  }

  $('#save-all').addEventListener('click', function () {
    var done = state.pack.filter(function (item) { return item.status === 'done'; });
    if (done.length === 0) return;
    var stamp = Date.now().toString().slice(-5);
    var chain = Promise.resolve(0);
    done.forEach(function (slot, i) {
      chain = chain.then(function (count) {
        return saveUrl(slot.url, 'sticker-' + slot.emotion.id + '-' + stamp + '.png').then(function () { return count + 1; });
      });
    });
    chain
      .then(function (count) { $('#pack-summary').textContent = t('savedAll', { n: count }); })
      .catch(function (e) { showErr('pack-err', e.message || String(e)); });
  });

  // ---------------------------------------------------------------------------
  // 大图预览
  // ---------------------------------------------------------------------------
  function openLightbox(index) {
    var slot = state.pack[index];
    if (!slot || slot.status !== 'done') return;
    state.lightbox = index;
    $('#lightbox-img').src = slot.url;
    $('#lightbox-cap').textContent = omni.lang === 'en' ? slot.emotion.en : slot.emotion.zh;
    $('#lightbox').classList.remove('hidden');
  }

  function closeLightbox() {
    state.lightbox = -1;
    $('#lightbox').classList.add('hidden');
  }

  $('#lb-close').addEventListener('click', closeLightbox);
  $('#lightbox').addEventListener('click', function (event) { if (event.target === this) closeLightbox(); });
  $('#lb-save').addEventListener('click', function () { if (state.lightbox >= 0) saveOne(state.lightbox); });
  $('#lb-again').addEventListener('click', function () {
    var index = state.lightbox;
    closeLightbox();
    if (index >= 0) regenOne(index);
  });
  $('#lb-motion').addEventListener('click', function () {
    var index = state.lightbox;
    closeLightbox();
    if (index >= 0) sendToMotion(index);
  });

  // ---------------------------------------------------------------------------
  // 页签 B：动图
  // ---------------------------------------------------------------------------
  var motionNodes = [];
  PROMPT.motions.forEach(function (motion) {
    var chip = el('button', 'chip', L(motion));
    chip.type = 'button';
    chip.setAttribute('aria-pressed', motion.id === state.motion.id ? 'true' : 'false');
    chip.addEventListener('click', function () {
      state.motion = motion;
      motionNodes.forEach(function (node) { node.setAttribute('aria-pressed', node.dataset.id === motion.id ? 'true' : 'false'); });
    });
    chip.dataset.id = motion.id;
    motionNodes.push(chip);
    $('#motions').appendChild(chip);
  });

  var sizeNodes = [];
  GIF_SIZES.forEach(function (size) {
    var chip = el('button', 'chip', size + 'px');
    chip.type = 'button';
    chip.setAttribute('aria-pressed', size === state.size ? 'true' : 'false');
    chip.addEventListener('click', function () {
      state.size = size;
      sizeNodes.forEach(function (node) { node.setAttribute('aria-pressed', node.textContent === size + 'px' ? 'true' : 'false'); });
    });
    sizeNodes.push(chip);
    $('#gif-sizes').appendChild(chip);
  });

  var speedNodes = [];
  SPEEDS.forEach(function (speed) {
    var chip = el('button', 'chip', L(speed));
    chip.type = 'button';
    chip.setAttribute('aria-pressed', speed.id === state.speed.id ? 'true' : 'false');
    chip.addEventListener('click', function () {
      state.speed = speed;
      speedNodes.forEach(function (node) { node.setAttribute('aria-pressed', node.dataset.id === speed.id ? 'true' : 'false'); });
    });
    chip.dataset.id = speed.id;
    speedNodes.push(chip);
    $('#gif-speeds').appendChild(chip);
  });

  function setGifBusy(on, text) {
    state.gifBusy = on;
    $('#gif-busy').classList.toggle('hidden', !on);
    if (text) $('#gif-busy-text').textContent = text;
    $('#run-gif').disabled = on || !state.choice || !state.choice.ready || !motionReady();
    $('#re-gif').classList.toggle('hidden', on || !state.frames);
  }

  /** 给媒体地址加一个时间戳破缓存（data: 地址不能加，加了就不是那张图了）。 */
  function withStamp(url, stamp) {
    if (!url || url.indexOf('data:') === 0) return url;
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + stamp;
  }

  function renderGif() {
    var box = $('#gif-result');
    if (!state.gif) { box.classList.add('hidden'); return; }
    box.classList.remove('hidden');
    $('#gif-img').src = withStamp(state.gif.url, state.gif.stamp);
    $('#gif-meta').textContent = t('gifMeta', {
      frames: state.gif.frames,
      size: state.size,
      delay: state.speed.delay,
      kb: Math.max(1, Math.round(state.gif.bytes / 1024)),
    });
    var strip = $('#gif-frames');
    strip.innerHTML = '';
    (state.gif.frameUrls || []).forEach(function (url, index) {
      var fig = el('figure');
      var img = el('img');
      img.src = url;
      img.alt = 'frame ' + (index + 1);
      fig.appendChild(img);
      fig.appendChild(el('figcaption', null, String(index + 1)));
      strip.appendChild(fig);
    });
  }

  /**
   * 一次改图。
   *
   * 参考图一律给 ref：源图在选中的那一刻就暂存过（见 pickPhoto），一套里的每一张、
   * 动图的每一帧都挂在同一个 ref 上 —— 宿主侧只暂存一份，也不用反复走文件对话框。
   */
  function edit(source, prompt) {
    if (!source || !source.ref) return Promise.reject(new Error(t('needStaged')));
    var params = {
      ref: source.ref,
      prompt: prompt,
      negativePrompt: PROMPT.negative,
      seed: seed(),
    };
    var choice = choiceParams();
    Object.keys(choice).forEach(function (key) { params[key] = choice[key]; });
    return omni.image.edit(params);
  }

  /**
   * 一次文生图（没有参考图）。
   *
   * 本地引擎（MLX / ComfyUI）走这条：角色完全由提示词里的描述决定，
   * 尺寸固定方图（表情包本来就要方图），种子每次不同 —— 同一段描述本来也画不出
   * 两张一样的图，那是文生图的固有差别，不是这里能"修"的。
   */
  function generate(prompt) {
    var params = {
      prompt: prompt,
      negativePrompt: PROMPT.negative,
      width: 1024,
      height: 1024,
      seed: seed(),
    };
    var choice = choiceParams();
    Object.keys(choice).forEach(function (key) { params[key] = choice[key]; });
    return omni.image.generate(params);
  }

  /**
   * 动图用哪份上下文。
   *
   * 从上面那一套点「动起来」带过来的，就用**那一套**的画风 / 描述（开跑那一刻定格的
   * 那份），而不是用户此刻在界面上改成的样子 —— 否则动图会画成另一个风格/角色。
   * 自己上传图片的（只有参考图模式有这个入口）就用界面上的当前值。
   */
  function motionContext() {
    if (state.packContext) return state.packContext;
    return {
      style: state.style,
      customStyle: state.customStyle,
      character: state.extra,
      withText: state.withText,
      emotion: null,
    };
  }

  /** 按当前模式发一次"画一张"：有参考图就改图，没有就按描述文生图。 */
  function drawOnce(source, prompt) {
    return supportsReference() ? edit(source, prompt) : generate(prompt);
  }

  /**
   * 生成动作帧并合成动图。
   *
   * 只生成两张（中段 / 顶点），第一帧直接用源表情 —— 播放顺序排成 A-B-C-B：
   * 首尾同源，循环点看不出跳变，也不必为"回到起始姿势"多花一次生成。
   */
  function makeGif() {
    if (state.gifBusy || !state.choice || !state.choice.ready) return;
    if (!motionReady()) {
      showErr('gif-err', supportsReference() ? t('needSource') : t('characterRequired'));
      return;
    }
    showErr('gif-err', '');

    var reference = supportsReference();
    var steps = state.motion.steps;
    var context = motionContext();
    // 第一帧是"静止起始帧"：
    //   参考图模式 = 源表情本身（不花一次生成，而且首尾同源、循环看不出跳变）；
    //   文字模式没有源图可用，只能按同一段描述先画一张静止的。
    var rest = reference
      ? { url: state.source.dataUrl || state.source.url, ref: state.source.ref }
      : null;
    var plan = reference ? steps.slice() : [REST_POSE[state.motion.id] || REST_POSE.breath].concat(steps);
    var picks = [];
    var done = 0;

    function next(i) {
      if (i >= plan.length) return Promise.resolve();
      setGifBusy(true, t('gifWorking', { done: done, total: plan.length }));
      var call = reference
        ? edit(state.source, framePrompt(plan[i], context))
        : generate(framePrompt(plan[i], context));
      return call
        .then(function (image) {
          picks.push(image);
          done += 1;
          setGifBusy(true, t('gifWorking', { done: done, total: plan.length }));
        })
        .then(function () { return next(i + 1); });
    }

    next(0)
      .then(function () {
        if (picks.length !== plan.length) throw new Error(t('gifNeedFrames'));
        // 序列 S = 起始帧 + 关键帧，播放顺序是 S 再倒着回来 —— 但**掐掉两端的重复**：
        // [A,B,C] → A,B,C,B（末尾不再回到 A，循环本身就是回到 A），
        // 两帧的情况 [A,B] 就正好是两个来回，不会变成 A,B,B。
        var seq = (rest ? [rest] : []).concat(picks);
        var frames = seq.concat(seq.slice(1, seq.length - 1).reverse());
        var refs = [];
        for (var i = 0; i < frames.length; i++) {
          if (!frames[i].ref) throw new Error(t('gifNeedFrames'));
          refs.push(frames[i].ref);
        }
        setGifBusy(true, t('gifMixing'));
        return omni.gif.make({ refs: refs, delayMs: state.speed.delay, size: state.size }).then(function (gif) {
          state.frames = { refs: refs, frameUrls: frames.map(function (frame) { return frame.url; }) };
          state.gif = {
            url: gif.url,
            ref: gif.ref,
            bytes: gif.bytes,
            frames: gif.frames,
            frameUrls: state.frames.frameUrls,
            stamp: Date.now(),
          };
          renderGif();
          omni.log('gif.done', 'gif assembled', { motion: state.motion.id, frames: gif.frames, size: state.size, delay: state.speed.delay });
        });
      })
      .catch(function (e) {
        showErr('gif-err', e.message || String(e));
        omni.log('gif.failed', e.message || String(e), { motion: state.motion.id });
      })
      .then(function () {
        setGifBusy(false);
        syncButtons();
      });
  }

  $('#run-gif').addEventListener('click', makeGif);

  // 只改速度 / 尺寸：帧还在，重新合成一遍即可（不再花生成调用）。
  $('#re-gif').addEventListener('click', function () {
    if (!state.frames || state.gifBusy) return;
    showErr('gif-err', '');
    setGifBusy(true, t('gifMixing'));
    omni.gif.make({ refs: state.frames.refs, delayMs: state.speed.delay, size: state.size })
      .then(function (gif) {
        state.gif = {
          url: gif.url, ref: gif.ref, bytes: gif.bytes, frames: gif.frames,
          frameUrls: state.frames.frameUrls, stamp: Date.now(),
        };
        renderGif();
      })
      .catch(function (e) { showErr('gif-err', e.message || String(e)); })
      .then(function () { setGifBusy(false); });
  });

  $('#save-gif').addEventListener('click', function () {
    if (!state.gif) return;
    saveUrl(state.gif.url, 'sticker-' + state.motion.id + '-' + Date.now().toString().slice(-5) + '.gif')
      .then(function (res) { $('#gif-ok').textContent = t('saved', { name: (res.path || '').split('/').pop() || '' }); })
      .catch(function (e) { showErr('gif-err', e.message || String(e)); });
  });

  /** 从一套里把某张送到页签 B：这一张已经在宿主侧有 ref，不用重新上传。 */
  function sendToMotion(index) {
    var slot = state.pack[index];
    if (!slot || slot.status !== 'done') return;
    // 记下这一张的情绪：文字模式下重画动作帧时，文案（"好耶！"）要跟它一致
    if (state.packContext) state.packContext.emotion = slot.emotion;
    state.source = { url: slot.url, ref: slot.ref, name: slot.emotion.id };
    state.frames = null;
    state.gif = null;
    paintDrop($('#motion-drop'), state.source, 'motionDrop', 'motionHint');
    renderGif();
    setTab('motion');
    syncButtons();
  }

  // ---------------------------------------------------------------------------
  // 页签与启动
  // ---------------------------------------------------------------------------
  function setTab(tab) {
    state.tab = tab;
    $('#tabbtn-pack').setAttribute('aria-selected', tab === 'pack' ? 'true' : 'false');
    $('#tabbtn-motion').setAttribute('aria-selected', tab === 'motion' ? 'true' : 'false');
    $('#pane-pack').classList.toggle('hidden', tab !== 'pack');
    $('#pane-motion').classList.toggle('hidden', tab !== 'motion');
  }

  $('#tabbtn-pack').addEventListener('click', function () { setTab('pack'); });
  $('#tabbtn-motion').addEventListener('click', function () { setTab('motion'); });

  // 去配置：缺引擎（本地）与缺厂商/Key（云端）是两件不同的事，送人去对地方。
  $('#gate-btn').addEventListener('click', function () {
    var local = state.kind === 'local';
    var engineMissing = local && state.choice && /引擎|engine/i.test(state.choice.why || '');
    omni.openSettings(engineMissing ? 'engines' : 'cloud');
  });

  // 模型选择：云端（厂商 + 模型）与本地（引擎 + 模型）各自记住自己的选择。
  document.querySelectorAll('#model-kind button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.kind = btn.dataset.kind === 'local' ? 'local' : 'cloud';
      paintPicker();
    });
  });
  $('#pick-provider').addEventListener('change', function () {
    state.providerId = this.value;
    state.cloudModel = '';
    paintPicker();
  });
  $('#pick-cloud-model').addEventListener('input', function () {
    state.cloudModel = this.value;
    syncChoice();
    checkGate();
    applyMode();
    var note = $('#model-note');
    if (state.choice && state.choice.supportsReference) note.textContent = t('modelNoteRef');
  });
  $('#pick-engine').addEventListener('change', function () {
    state.localBackend = this.value;
    state.localModel = '';
    paintPicker();
  });
  $('#pick-local-model').addEventListener('input', function () {
    state.localModel = this.value;
    paintPicker();
  });

  // 本地模式没有照片可用：一键切到云端（没配过厂商就送去设置页）
  // 用户在设置里配好厂商 / 下好模型又切回来：重读目录（不动他在这一页的选择）
  omni.onCapabilities = function () { void loadModels(false); };

  $('#to-cloud').addEventListener('click', function () {
    if (cloudProviders().length === 0) {
      omni.openSettings('cloud');
      return;
    }
    state.kind = 'cloud';
    paintPicker();
  });

  function paint() {
    document.querySelectorAll('[data-i18n]').forEach(function (node) { node.textContent = t(node.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(function (node) { node.placeholder = t(node.dataset.i18nPh); });
    // 画风 / 动作 / 速度的名字与页签标题一样是动态的，重画一遍（切语言时不能只有静态文案变）
    PROMPT.styles.forEach(function (style) {
      var node = styleNodes[style.id];
      if (!node) return;
      node.querySelector('.nm').textContent = L(style);
      var desc = node.querySelector('.dt');
      if (desc) desc.textContent = L(style, 'Desc');
    });
    motionNodes.forEach(function (node) {
      var motion = PROMPT.motions.filter(function (m) { return m.id === node.dataset.id; })[0];
      if (motion) node.textContent = L(motion);
    });
    speedNodes.forEach(function (node) {
      var speed = SPEEDS.filter(function (s) { return s.id === node.dataset.id; })[0];
      if (speed) node.textContent = L(speed);
    });
    $('#lightbox-cap').textContent = state.lightbox >= 0 && state.pack[state.lightbox]
      ? (omni.lang === 'en' ? state.pack[state.lightbox].emotion.en : state.pack[state.lightbox].emotion.zh)
      : '';
  }

  omni.ready.then(function () {
    paint();
    setTab('pack');
    updateProgress();
    applyMode();
    // 模型目录是这一页能不能跑的前提：拉到之前按钮保持禁用，别让用户点了才报错。
    loadModels(true).then(function () {
      omni.log('models.loaded', 'image catalog loaded', {
        cloud: cloudProviders().length,
        local: localGroups().length,
        backend: state.choice && state.choice.backend,
      });
    });
  });
})();
</script>
</body>
</html>
